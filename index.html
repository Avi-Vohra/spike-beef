<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Spike Beef</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="ui-overlay"></div>
    <div id="taunt-bar">
      <button class="taunt-btn" data-emote="laugh" aria-label="Laugh">&#128514;</button>
      <button class="taunt-btn" data-emote="cry" aria-label="Cry">&#128557;</button>
      <button class="taunt-btn" data-emote="sleep" aria-label="Sleep">&#128164;</button>
      <button class="taunt-btn" data-emote="flex" aria-label="Flex">&#128170;</button>
    </div>
    <div id="touch-controls">
      <button id="btn-left" class="touch-btn touch-btn-move" aria-label="Left">&#9664;</button>
      <button id="btn-right" class="touch-btn touch-btn-move" aria-label="Right">&#9654;</button>
      <button id="btn-jump" class="touch-btn touch-btn-action" aria-label="Jump">JUMP</button>
      <button id="btn-hit" class="touch-btn touch-btn-action" aria-label="Hit">HIT</button>
    </div>
  </div>
  <div id="rotate-overlay">
    <div class="sb-panel">
      <p class="sb-text">Rotate your phone to play Spike Beef.</p>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
